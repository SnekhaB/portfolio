<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to the home page with the path preserved
      // This allows the SPA router to handle all routes
      const path = window.location.pathname;
      const searchParams = window.location.search;
      const hash = window.location.hash;
      
      // Store the original path and redirect to home
      sessionStorage.setItem('redirect_to', path + searchParams + hash);
      window.location.href = '/';
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
